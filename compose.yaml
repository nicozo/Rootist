services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 開発環境
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development # 開発ステージを指定
    ports:
      # ホスト側ポートは DEV_PORT で変更可（未設定・空なら 5173）。命名規則は .claude/rules/docker-worktree.md 参照
      - '${DEV_PORT:-5173}:5173'
    volumes:
      - .:/app
      - /app/node_modules # コンテナ内のnode_modulesをホストと共有しない
      - /app/.pnpm-store # pnpmのストアをホストと共有しない
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    networks:
      - app-network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # テスト・検証（使い捨て）
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 使い方: docker compose run --rm tools pnpm check  （コマンドと注意点は CLAUDE.md の Commands）
  # ポートは公開しない（E2E の 4173 はコンテナ内で閉じる）ので、issue 単位の環境と衝突しない
  tools:
    profiles:
      - tools
    build:
      context: .
      dockerfile: Dockerfile
      target: tooling
    volumes:
      - .:/app
      - /app/node_modules # コンテナ内のnode_modulesをホストと共有しない（run --rm で一緒に消える）
      - /app/.pnpm-store
      - /dev/null:/app/.env:ro # bind mount 経由で実値の .env を読ませない（ダミーの環境変数だけで動かす）
    environment:
      - CI=true
      # テストは Supabase・DB・外部 API に接続しない。CI（.github/workflows/ci.yml の test ジョブ）と同じダミー値。.env は読まない
      - DATABASE_URL=postgresql://ci:ci@localhost:5432/ci
      - SUPABASE_URL=http://127.0.0.1:54321
      - SUPABASE_PUBLISHABLE_KEY=ci-dummy-publishable-key
      - GOOGLE_MAPS_API_KEY=
      - GEMINI_API_KEY=
      - GOOGLE_AUTH_ENABLED=
    networks:
      - app-network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 本番環境
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  prod:
    profiles:
      - prod
    build:
      context: .
      dockerfile: Dockerfile
      target: production # 本番ステージを指定
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      # Supabase 接続情報など。.env の値を受け渡す（必須の変数が未設定ならアプリは env_invalid で失敗する。必須の変数は src/env.ts が正）
      - DATABASE_URL=${DATABASE_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      - GOOGLE_AUTH_ENABLED=${GOOGLE_AUTH_ENABLED:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # 本番環境用の環境変数
      - ORIGIN=https://yourdomain.com
      - BODY_SIZE_LIMIT=10485760
    restart: unless-stopped
    networks:
      - app-network
    # ヘルスチェック
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pnpm_store:
  node_modules:

networks:
  app-network:
    driver: bridge
