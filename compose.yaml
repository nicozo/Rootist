services:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 開発環境
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development # 開発ステージを指定
    ports:
      # ホスト側ポートは DEV_PORT で変更可（未設定・空なら 5173）。命名規則は CLAUDE.md「Docker 開発環境」参照
      - '${DEV_PORT:-5173}:5173'
    volumes:
      - .:/app
      - /app/node_modules # コンテナ内のnode_modulesをホストと共有しない
      - /app/.pnpm-store # pnpmのストアをホストと共有しない
    environment:
      - NODE_ENV=development
    stdin_open: true
    tty: true
    networks:
      - app-network

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 本番環境
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  prod:
    profiles:
      - prod
    build:
      context: .
      dockerfile: Dockerfile
      target: production # 本番ステージを指定
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      # Supabase 接続情報など。.env の値を受け渡す（DATABASE_URL が未設定ならアプリが起動時に DATABASE_URL is not set で失敗する）
      - DATABASE_URL=${DATABASE_URL:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY:-}
      - GOOGLE_AUTH_ENABLED=${GOOGLE_AUTH_ENABLED:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # 本番環境用の環境変数
      - ORIGIN=https://yourdomain.com
      - BODY_SIZE_LIMIT=10485760
    restart: unless-stopped
    networks:
      - app-network
    # ヘルスチェック
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pnpm_store:
  node_modules:

networks:
  app-network:
    driver: bridge
